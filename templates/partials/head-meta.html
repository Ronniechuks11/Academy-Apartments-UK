<!-- Favicons (Academy Apartments brand mark) -->
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon-32x32.png') }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon-16x16.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
<link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
<meta name="theme-color" content="#A63D2F">

<!-- Canonical -->
<link rel="canonical" href="{{ site_url }}{{ request.path }}">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Academy Apartments">
<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ og_description }}">
<meta property="og:url" content="{{ site_url }}{{ request.path }}">
<meta property="og:image" content="{{ site_url }}{{ url_for('static', filename='images/hero.png') }}">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ og_description }}">
<meta name="twitter:image" content="{{ site_url }}{{ url_for('static', filename='images/hero.png') }}">
